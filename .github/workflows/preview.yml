name: Preview Build

on:
  workflow_dispatch:

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status

      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25

      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core

  build:
    name: Build Preview APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status

      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-preview-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Verify sdkmanager and install NDK
        run: |
          command -v sdkmanager
          sdkmanager --install "ndk;25.0.8775105"

      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          set -euo pipefail

          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"

          ./run init action gradle
          ./gradlew app:assemblePreviewRelease --stacktrace

          mapfile -t APKS < <(find app/build/outputs/apk -type f -name '*arm64-v8a*.apk' -print)
          if [[ "${#APKS[@]}" -ne 1 ]]; then
            echo "Expected exactly one ARM64 APK, found ${#APKS[@]}."
            find app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK=${APKS[0]}" >> "$GITHUB_ENV"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Preview-ARM64-APK
          path: ${{ env.APK }}
          if-no-files-found: error
